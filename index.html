<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Women Fiber to Fashion — Ethical Garment Manufacturing, New Delhi</title>
<meta name="description" content="Purpose-driven garment manufacturing in New Delhi. Women-led, ethically made, shipping globally.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E4DED2'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='18' font-weight='700' fill='%234A423E' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#E4DED2;
    --ink:#4A423E;
    --terracotta:#B06A40;
    --terracotta-ink:#8A4F2D;
    --tan:#D1B59E;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    position:relative;
    overflow-x:hidden;
  }
  .arcs{
    position:absolute;
    left:-22vw;
    top:50%;
    transform:translateY(-50%);
    width:70vw;
    max-width:820px;
    pointer-events:none;
    z-index:0;
  }
  .arcs ellipse{fill:none;stroke:var(--terracotta);stroke-width:1;opacity:.55}
  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1180px;
    margin:0 auto;
    padding:12vh 7vw;
  }
  .inner{max-width:640px;margin-left:auto}
  h1{
    font-family:'Montserrat',system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(2.6rem,8.5vw,5.5rem);
    line-height:.95;
    letter-spacing:-.03em;
    margin:0 0 1.6rem;
    text-transform:uppercase;
  }
  .tagline{
    font-family:'Montserrat',system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(.72rem,1.6vw,.86rem);
    letter-spacing:.18em;
    text-transform:uppercase;
    margin:0 0 3.2rem;
  }
  .rule{border:0;border-top:1px solid var(--terracotta);width:74px;margin:0 0 2.4rem}
  .meta{
    font-family:'Montserrat',system-ui,sans-serif;
    font-weight:600;
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    margin:0 0 .55rem;
  }
  .place{font-size:.95rem;margin:0 0 3rem;opacity:.85}
  .soon{
    font-family:'Montserrat',system-ui,sans-serif;
    font-weight:600;
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--terracotta-ink);
    margin:0 0 1.1rem;
  }
  a{color:var(--terracotta-ink);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
  a:hover{color:var(--ink)}
  a:focus-visible{outline:2px solid var(--terracotta-ink);outline-offset:3px;border-radius:2px}
  .links{display:flex;gap:1.8rem;flex-wrap:wrap;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.08em}
  @media (max-width:640px){
    .wrap{padding:9vh 7vw}
    .arcs{left:-62vw;width:115vw;opacity:.45}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<svg class="arcs" viewBox="0 0 600 900" aria-hidden="true" focusable="false">
  <g>
    <ellipse cx="130" cy="450" rx="60"  ry="130"/>
    <ellipse cx="130" cy="450" rx="88"  ry="176"/>
    <ellipse cx="130" cy="450" rx="116" ry="222"/>
    <ellipse cx="130" cy="450" rx="144" ry="268"/>
    <ellipse cx="130" cy="450" rx="172" ry="314"/>
    <ellipse cx="130" cy="450" rx="200" ry="360"/>
    <ellipse cx="130" cy="450" rx="228" ry="406"/>
    <ellipse cx="130" cy="450" rx="256" ry="452"/>
    <ellipse cx="130" cy="450" rx="284" ry="498"/>
  </g>
</svg>

<main class="wrap">
  <div class="inner">
    <h1>Women<br>Fiber&nbsp;to<br>Fashion</h1>
    <p class="tagline">Made by the Brave. Built on Defiance.</p>
    <hr class="rule">
    <p class="meta">Garments · Home Linen · Accessories</p>
    <p class="meta">Purpose-Driven Manufacturing</p>
    <p class="place">New Delhi, India — shipping globally</p>
    <p class="soon">Full site coming soon</p>
    <p class="links">
      <a href="https://www.instagram.com/wftofashion/" rel="noopener">Instagram</a>
      <a href="https://www.linkedin.com/in/women-fiber-to-fashion-107574148/" rel="noopener">LinkedIn</a>
    </p>
  </div>
</main>

</body>
</html>
